name: Capture and validate latest game UI
on:
  push:
    paths: ['.github/workflows/capture-v052.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Capture current build in Chromium
        run: |
          mkdir -p screenshots
          cat > capture.mjs <<'EOF'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
          page.on('pageerror',err=>console.log('PAGE ERROR:',err.message));
          await page.goto('file://' + process.cwd() + '/dist/index.html',{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(1200);
          await page.screenshot({path:'screenshots/v052-lobby.png',fullPage:true});
          async function click(action,id){
            const sel='[data-action="'+action+'"]'+(id?'[data-id="'+id+'"]':'');
            await page.locator(sel).first().click();await page.waitForTimeout(500);
          }
          await click('nav','towers');
          await page.screenshot({path:'screenshots/v052-loadout.png',fullPage:true});
          await click('setCollectionTab','packs');
          if(await page.locator('.collection-layout').count())throw Error('Tower collection still overlaps monster pack page');
          if(await page.locator('.pack-choice').count()!==5)throw Error('All five packs must be selectable for preview');
          const checkLayout=async(label)=>{
            const result=await page.evaluate(()=>{
              const tabs=document.querySelector('.collection-switch').getBoundingClientRect();
              const pack=document.querySelector('.pack-config-screen').getBoundingClientRect();
              const detail=document.querySelector('.pack-detail-panel').getBoundingClientRect();
              return {tabsBottom:tabs.bottom,packTop:pack.top,detailTop:detail.top,packBottom:pack.bottom};
            });
            if(result.packTop<result.tabsBottom-2||result.detailTop<result.packTop)
              throw Error(label+' has overlapping panels: '+JSON.stringify(result));
          };
          await checkLayout('desktop');
          await click('previewPack','lab');
          if(await page.locator('[data-action="visitPackShop"]').count()!==1)throw Error('Locked pack purchase link missing');
          await click('previewPack','basic');
          await page.screenshot({path:'screenshots/monster-pack-fixed-desktop.png',fullPage:true});
          await page.setViewportSize({width:390,height:844});
          await page.waitForTimeout(500);
          await checkLayout('mobile');
          await page.screenshot({path:'screenshots/monster-pack-fixed-mobile.png',fullPage:true});
          await page.setViewportSize({width:1440,height:900});
          await click('nav','shop');await click('shopTab','packs');
          await page.screenshot({path:'screenshots/v052-monster-packs.png',fullPage:true});
          await click('shopTab','crates');
          await page.screenshot({path:'screenshots/v052-skin-crates.png',fullPage:true});
          await click('nav','home');await click('start');
          await page.waitForTimeout(1500);
          await page.screenshot({path:'screenshots/v052-battle.png',fullPage:true});
          await browser.close();
          EOF
          node capture.mjs
      - name: Save screenshots in repository
        run: |
          rm capture.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screenshots/v052-*.png screenshots/monster-pack-fixed-*.png
          git commit -m 'Validate monster pack UI geometry and save real Chromium screenshots'
          git push origin HEAD:main
