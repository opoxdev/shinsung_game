name: Capture actual v0.9.2 game screens
on:
  push:
    paths: ['.github/workflows/capture-v052.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Capture live game UI in headless Chromium
        run: |
          mkdir -p screenshots
          cat > capture.mjs <<'EOF'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
          const errors=[];
          page.on('pageerror',err=>{errors.push(err.message);console.error('PAGE ERROR:',err.message)});
          await page.goto('file://' + process.cwd() + '/dist/index.html',{waitUntil:'domcontentloaded'});
          await page.waitForSelector('[data-action="start"]');
          const shot=async(name)=>{
            await page.waitForTimeout(350);
            await page.screenshot({path:'screenshots/v092-'+name+'.png',fullPage:true,animations:'disabled'});
            console.log('CAPTURED',name);
          };
          const click=async(action,id)=>{
            const locator=page.locator('[data-action="'+action+'"]'+(id?'[data-id="'+id+'"]':'')).first();
            await locator.click();
            await page.waitForTimeout(180);
          };
          await shot('01-lobby');
          const startFunds={easy:500,normal:650,hard:850,extreme:1100,hell:1400,ruin:1800};
          for(const [id,cash] of Object.entries(startFunds)){
            await click('difficulty',id);
            if(!(await page.locator('.deploy-note').innerText()).includes('₩ '+cash.toLocaleString('en-US')))
              throw Error('Starting money not displayed for '+id);
          }
          await click('difficulty','hard');await shot('02-difficulty');
          await click('difficulty','easy');
          await click('nav','towers');
          if(await page.locator('.tower-card').count()!==30)throw Error('Expected all 30 tower cards');
          if(await page.locator('.tower-card svg[data-design="v2"]').count()!==30)throw Error('Full redesigned SVG roster did not render');
          if(!(await page.locator('[data-action="inspect"][data-id="scout"] .card-name').innerText()).includes('새총잡이'))throw Error('Legacy cute scout identity still shown');
          if(!(await page.locator('[data-action="inspect"][data-id="chef"] .card-name').innerText()).includes('투척병'))throw Error('Grenadier conversion missing');
          if(await page.locator('#rarity-filter option').count()!==6)throw Error('Expected five rarity choices plus all');
          await shot('03-tower-collection');
          const infoWidth=await page.locator('.tower-detail').evaluate(el=>el.getBoundingClientRect().width);
          if(infoWidth<360)throw Error('Tower information panel is still too narrow: '+infoWidth);
          await page.locator('.tower-groups').evaluate(el=>el.scrollTop=360);
          const towerScroll=await page.locator('.tower-groups').evaluate(el=>el.scrollTop);
          if(towerScroll<=50)throw Error('Tower collection is not scrollable during regression test');
          await page.locator('[data-action="inspect"][data-id="archer"]').evaluate(el=>el.click());
          const towerAfter=await page.locator('.tower-groups').evaluate(el=>el.scrollTop);
          if(Math.abs(towerAfter-towerScroll)>4)throw Error('Selecting a tower jumps the collection scroll to top');
          const tierCounts={common:4,rare:7,epic:10,legendary:5,mythic:4};
          const artTiers={common:'everyday',rare:'craft',epic:'specialist',legendary:'iconic',mythic:'myth'};
          let rankIndex=25;
          const cardBackgrounds=new Set();
          for(const [rarity,count] of Object.entries(tierCounts)){
            await page.locator('#rarity-filter').selectOption(rarity);
            if(await page.locator('.tower-card').count()!==count)throw Error('Roster count wrong for '+rarity);
            if(await page.locator('.tower-card svg[data-art-tier="'+artTiers[rarity]+'"]').count()!==count)throw Error('Wrong art tier for '+rarity);
            cardBackgrounds.add(await page.locator('.tower-card').first().evaluate(el=>getComputedStyle(el).backgroundImage));
            await shot(String(rankIndex++)+'-'+rarity+'-identity');
          }
          if(cardBackgrounds.size!==5)throw Error('Every rarity needs its own collection frame hierarchy');
          await page.locator('#rarity-filter').selectOption('all');
          await click('inspect','scout');await shot('30-simple-slingshot');
          await click('inspect','icewitch');await shot('31-frost-apprentice');
          await click('inspect','spirit');await shot('32-drone-operator');
          await click('inspect','prism');await shot('33-legendary-prism');
          await click('inspect','chef');await shot('20-thrower-default');
          await click('inspect','blade');await shot('21-swordsman-default');
          await click('inspect','starseed');await shot('04-mythic-early-starseed');
          await click('inspect','hunter');await shot('05-rare-late-hunter');
          await click('inspect','scout');await click('skin','scout');
          if(await page.locator('.skin-wardrobe-item').count()>=15)throw Error('All skins must not appear for one unit');
          if(await page.locator('.skin-wardrobe-item').count()<=2)throw Error('Expected multiple authored scout costumes');
          await shot('06-tower-skins');await click('close');
          await click('setCollectionTab','packs');
          if(await page.locator('.collection-layout').count())throw Error('Overlapping tower collection detected');
          if(await page.locator('.pack-choice').count()!==5)throw Error('Expected five monster packs');
          await shot('07-monster-loadout');
          await click('previewPack','lab');await shot('08-monster-pack-preview');
          await click('nav','shop');await shot('09-shop-towers');
          await click('shopTab','packs');await shot('10-shop-monster-packs');
          await click('shopTab','crates');
          if(await page.locator('.crate-offer').count()!==5)throw Error('Five themed cosmetic crates must be displayed');
          if(await page.locator('.crate-cosmetic-choice').count()!==19)throw Error('Missing skin-specific art previews');
          if(await page.locator('.crate-skin-preview svg[data-design="v2"]').count()!==19)throw Error('Cosmetics must render new character models');
          if(await page.locator('.crate-cosmetic-choice:has-text("구미호 가면검객")').count()!==1)throw Error('Kitsune skin not visible');
          if(await page.locator('.crate-cosmetic-choice:has-text("도넛 요리사")').count()!==1)throw Error('Donut chef skin not visible');
          const expected={forest:400,wardrobe:1000,winter:1500,cyber:3000,astral:5000};
          for(const [id,price] of Object.entries(expected)){
            const one=page.locator('[data-action="openCrate"][data-id="'+id+':1"]');
            const ten=page.locator('[data-action="openCrate"][data-id="'+id+':10"]');
            if(await one.count()!==1||await ten.count()!==1)throw Error('Missing '+id+' crate controls');
            if(!(await one.innerText()).includes(price.toLocaleString('en-US')))throw Error('Wrong price for '+id);
            if(!(await ten.innerText()).includes((price*10).toLocaleString('en-US')))throw Error('Wrong 10-pull price for '+id);
          }
          await shot('11-skin-crates');
          await page.locator('.shop-scroll').evaluate(el=>el.scrollTop=270);
          const shopBefore=await page.locator('.shop-scroll').evaluate(el=>el.scrollTop);
          if(shopBefore<=50)throw Error('Shop scroll test needs an overflowing list');
          await page.locator('[data-action="shopTab"][data-id="towers"]').evaluate(el=>el.click());
          const shopAfter=await page.locator('.shop-scroll').evaluate(el=>el.scrollTop);
          if(Math.abs(shopAfter-shopBefore)>4)throw Error('Changing shop tab resets scrolling');
          await click('shopTab','crates');
          await click('pvp');
          if(await page.locator('#public-room-list').count()!==1)throw Error('PvP public room browser is missing');
          if(await page.locator('[data-action="refreshRooms"]').count()!==1)throw Error('PvP room refresh missing');
          await shot('12-pvp-menu');await click('close');
          await click('coop');
          if(await page.locator('#public-room-list[data-mode="coop"]').count()!==1)throw Error('Co-op public room browser missing');
          await shot('13-coop-menu');await click('close');
          await click('events');await shot('14-events');await click('close');
          await click('nav','home');await click('start');
          await page.waitForSelector('#battlefield');await page.waitForTimeout(800);
          await shot('15-battle');
          await click('selectPlace','scout');
          const canvas=page.locator('#battlefield');
          // World point 430,400 is beside the bend in the plains road,
          // converted to canvas coordinates using the shipped camera's scale.
          const coords=await canvas.evaluate(c=>{
            const w=c.getBoundingClientRect();
            const scale=Math.min(w.width/1800,w.height/1100)*1.18;
            return {x:w.width/2+(430-900)*scale,y:w.height/2+(400-550)*scale};
          });
          await canvas.click({position:coords});
          await click('cancelPlace');
          await canvas.click({position:coords});
          if(!(await page.locator('#tower-count').innerText()).startsWith('1 /'))throw Error('Failed to install tower for real combat screenshot');
          if(!(await page.locator('#tower-inspector h2').count()))throw Error('Upgrade inspector did not open');
          const upgradeWidth=await page.locator('#tower-inspector').evaluate(el=>el.getBoundingClientRect().width);
          if(upgradeWidth<335)throw Error('Evolution panel is still too narrow: '+upgradeWidth);
          await shot('16-battle-upgrade');
          await page.waitForTimeout(6300);
          await shot('23-combat-damage');
          let hovered=false;
          for(const x of Array.from({length:30},(_,i)=>60+i*20)){
            await page.mouse.move(x,460);await page.waitForTimeout(70);
            if(await page.locator('#enemy-tooltip.visible').count()){
              hovered=true;
              const text=await page.locator('#enemy-tooltip').innerText();
              if(!text.includes('체력'))throw Error('Enemy info lacks HP');
              await shot('24-enemy-mouse-hover');break;
            }
          }
          if(!hovered)console.warn('No enemy was under the scanned pointer during the capture window');
          await page.reload({waitUntil:'domcontentloaded'});await page.waitForSelector('[data-action="pvp"]');
          await click('pvp');await click('trainingPvp');
          await page.waitForSelector('.monster-tray');await shot('17-pvp-training');
          await page.reload({waitUntil:'domcontentloaded'});await page.waitForSelector('[data-action="start"]');
          await page.setViewportSize({width:390,height:844});await shot('18-mobile-lobby');
          await click('nav','towers');await click('setCollectionTab','packs');await shot('19-mobile-monster-loadout');
          await click('setCollectionTab','towers');
          await click('inspect','scout');await click('skin','scout');
          if(await page.locator('.skin-wardrobe-item').count()<=2)throw Error('Mobile custom wardrobe did not load');
          await shot('22-mobile-custom-skins');await click('close');
          if(errors.length)throw Error('Game page errors: '+errors.join(' | '));
          await browser.close();
          EOF
          node capture.mjs
      - name: Commit real screenshots to repository
        run: |
          rm capture.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screenshots/v092-*.png
          git commit -m 'Record actual v0.9.2 Chromium screenshots across game UI'
          git reset --hard HEAD
          git pull --rebase origin main
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
            git pull --rebase origin main
          done
          echo 'Could not save screenshots after five rebase retries' >&2
          exit 1
