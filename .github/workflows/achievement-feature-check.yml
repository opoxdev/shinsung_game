name: Achievement system feature verification
on:
  push:
    branches: [feature/achievement-system-20261101]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs
      - run: node scripts/offline-browser-smoke.mjs
      - run: node scripts/achievement-browser-smoke.mjs
