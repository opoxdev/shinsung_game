name = "shinsung-defense"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# Public Firebase project ID. D1 database ID is configured after creation.
FIREBASE_PROJECT_ID = "shinsung-td"

[[d1_databases]]
binding = "DB"
database_name = "shinsung-profiles"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
