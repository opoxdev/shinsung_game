const STEP = .05;
function bounty(hp) {

}
const dist = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);

}

}

function damage(s,e,n,t) {

    const team=Object.values(s.players).filter(p=>p.field===e.field);
    const reward=bounty(e.maxHp)/team.length;
    team.forEach(p=>p.money+=reward);s.kills++;

}

          if(e.type==='soldier'){g.beginPath();g.moveTo(e.x,e.y-20);for(let j=1;j<7;j++)g.lineTo(e.x+(e.tx-e.x)*j/7+(j%2?8:-8),e.y-20+(e.ty-e.y+20)*j/7);g.lineTo(e.tx,e.ty);g.stroke();}

          else if(e.type==='sonic'){for(let j=0;j<3;j++){g.beginPath();g.arc(e.tx,e.ty,6+age*120+j*10,0,7);g.stroke();}}
          else if(e.kind==='melee'){g.lineWidth=7;g.beginPath();g.arc(e.x,e.y,12+age*90,-1.5,1.4);g.stroke();}
          else if(e.kind==='ranged'){const f=Math.min(1,age/.15);g.fillStyle='#fff3bf';g.beginPath();g.arc(e.x+(e.tx-e.x)*f,e.y-20+(e.ty-e.y+20)*f,5,0,7);g.fill();}
          else if(e.kind==='splash'){g.lineWidth=5;g.beginPath();g.arc(e.tx,e.ty,12+age*100,0,7);g.stroke();for(let j=0;j<6;j++){const a=j*6.28/6;g.fillStyle='#ffdd83';g.fillRect(e.tx+Math.cos(a)*age*120,e.ty+Math.sin(a)*age*120,5,5);}}
          else {g.beginPath();g.arc(e.tx||e.x,e.ty||e.y,8+age*70,0,7);g.stroke();}g.globalAlpha=1;g.shadowBlur=0;}
        if(this.preview&&this.pointer&&f===field){const p={x:this.pointer.x-offset,y:this.pointer.y},ok=canPlace(state,field,p.x,p.y);g.fillStyle=ok?'#9ccf7922':'#eb807b33';g.strokeStyle=ok?'#c1e08c':'#ed887d';g.beginPath();g.arc(p.x,p.y,TOWERS[this.preview].range,0,7);g.fill();g.stroke();g.globalAlpha=.65;this.tower(g,{...p,type:this.preview,level:0},now);g.globalAlpha=1;}
      }
      g.restore();
    }
    g.restore();
    if(lobby){const grad=g.createLinearGradient(0,0,0,this.height);grad.addColorStop(0,'#101b1230');grad.addColorStop(.45,'#101b1200');grad.addColorStop(1,'#18234780');g.fillStyle=grad;g.fillRect(0,0,this.width,this.height);}
  }
  tower(g,t,time){const d=TOWERS[t.type],c=d.color,lev=t.level||0;g.save();g.translate(t.x,t.y);g.fillStyle='#18294b55';g.beginPath();g.ellipse(4,6,25,13,0,0,7);g.fill();g.strokeStyle=RARITIES[d.rarity].color;g.lineWidth=2;g.beginPath();g.ellipse(0,3,25,12,0,0,7);g.stroke();
    if(['buff','summon'].includes(d.kind)||t.type==='sonic'){g.strokeStyle=c+'99';g.beginPath();g.ellipse(0,3,29+Math.sin(time*3)*5,14,0,0,7);g.stroke();}
    const img=sprite(t.type,t.skin||'default'),size=75+lev*3,bob=Math.sin(time*(t.type==='sonic'?5:2)+t.x)*1.6;
    if(img.complete&&img.naturalWidth)g.drawImage(img,-size*.5,-size*.87+bob,size,size*210/180);
    g.fillStyle='#ffe892';for(let i=0;i<lev;i++)g.fillRect(-8+i*7,25,4,4);g.restore();
  }
  summon(g,u,time){
    // Animated goblin familiar, distinct from towers and enemies.
    const bob=Math.sin(time*11+u.id)*2;
    g.save();g.translate(u.x,u.y+bob);
    g.fillStyle='#17343c55';g.beginPath();g.ellipse(0,13,15,6,0,0,7);g.fill();
    g.fillStyle='#5b8750';g.fillRect(-8,2,6,12);g.fillRect(2,2,6,12);
    g.fillStyle='#7ac77a';g.beginPath();g.moveTo(-8,-7);g.lineTo(-19,-13);g.lineTo(-14,4);g.lineTo(-8,2);g.moveTo(8,-7);g.lineTo(19,-13);g.lineTo(14,4);g.lineTo(8,2);g.fill();
    g.fillStyle='#96eb80';g.beginPath();g.arc(0,-5,11,0,7);g.fill();
    g.fillStyle='#243e55';g.fillRect(-7,-8,4,4);g.fillRect(3,-8,4,4);
    g.strokeStyle='#c9fb9c';g.lineWidth=2;g.beginPath();g.moveTo(-2,1);g.lineTo(2,1);g.stroke();
    g.restore();
  }
  enemy(g,e,time){
    const d=ENEMIES[e.type],r=d.size||12;
    const mech=['mk1','mk2','chain','mecha'].includes(e.type);
    const giant=['boss','fastboss','doom','apocalypse'].includes(e.type);
    const fast=['runner','fastboss','mk2'].includes(e.type);
    const armored=['heavy','tank','chain','mecha','doom','apocalypse'].includes(e.type);
    const pulse=Math.sin(time*6+e.id),leg=Math.sin(time*(fast?18:8)+e.id)*3;
    g.save();g.translate(e.x,e.y);
    g.fillStyle='#09203966';g.beginPath();g.ellipse(3,10,r*1.15,r*.55,0,0,7);g.fill();
    if(['doom','apocalypse'].includes(e.type)){
      g.shadowColor=d.color;g.shadowBlur=15+Math.abs(pulse)*8;
      g.strokeStyle=d.color;g.globalAlpha=.55;g.lineWidth=3;
      g.beginPath();g.arc(0,-7,r+7+pulse*3,0,7);g.stroke();g.globalAlpha=1;
    }
    if(fast){g.strokeStyle=d.color;g.globalAlpha=.4;g.lineWidth=3;
      for(let i=0;i<3;i++){g.beginPath();g.moveTo(-r-8-i*8,-8+i*6);g.lineTo(-r-18-i*9,-8+i*6);g.stroke();}g.globalAlpha=1;}
    g.fillStyle=mech?'#536479':'#4b6158';
    g.fillRect(-r*.65,r*.4,r*.45,r*.6+leg);
    g.fillRect(r*.18,r*.4,r*.45,r*.6-leg);
    // Body silhouette: big rectangular brutes, robots with angular chassis, and classic round zombies.
    g.fillStyle=d.color;
    if(mech){g.beginPath();g.moveTo(-r*.95,-r*.6);g.lineTo(r*.8,-r*.8);g.lineTo(r*1.08,r*.45);g.lineTo(-r*.75,r*.7);g.closePath();g.fill();}
    else if(giant||armored){g.beginPath();g.roundRect(-r,-r*.65,r*2,r*1.45,armored?4:10);g.fill();}
    else {g.beginPath();g.ellipse(0,0,r*.78,r*.9,fast?-.18:0,0,7);g.fill();}
    g.fillStyle=mech?'#45536b':'#496a60';
    g.fillRect(-r-5,-r*.45,r*.3,r*.65+leg*.15);
    g.fillRect(r*.75,-r*.45,r*.3,r*.65-leg*.15);
    if(armored){g.fillStyle='#223b50';g.globalAlpha=.7;
      g.fillRect(-r*.7,-r*.25,r*1.4,r*.35);g.fillRect(-r*.65,r*.35,r*1.25,r*.18);g.globalAlpha=1;}
    const headY=-r*.62+pulse*1.1;
    g.fillStyle=mech?'#b3c7ce':giant?'#ded4a7':'#b6d6a3';
    if(mech){g.beginPath();g.moveTo(-r*.67,headY-r*.65);g.lineTo(r*.65,headY-r*.65);g.lineTo(r*.77,headY+r*.12);g.lineTo(-r*.7,headY+r*.2);g.closePath();g.fill();}
    else {g.beginPath();g.roundRect(-r*.65,headY-r*.7,r*1.3,r*.95,giant?5:3);g.fill();}
    if(e.type==='tank'||e.type==='mecha'||e.type==='apocalypse'){
      g.fillStyle='#34475d';g.fillRect(-r*.85,headY-r*.9,r*1.7,r*.38);
      g.fillStyle=d.color;g.fillRect(-r*.35,headY-r*.92,r*.7,r*.15);
    }
    if(e.type==='chain'){g.strokeStyle='#d7d8f7';g.lineWidth=2;
      for(let i=0;i<4;i++){g.beginPath();g.ellipse(-r*.5+i*r*.3,-r*.2+i*3,4,6,1,0,7);g.stroke();}}
    if(['doom','apocalypse'].includes(e.type)){
      g.fillStyle='#fa919e';for(let i=-1;i<=1;i++){g.beginPath();g.moveTo(i*r*.4,headY-r*.65);g.lineTo((i-.3)*r*.4,headY-r*1.25);g.lineTo((i+.3)*r*.4,headY-r*.65);g.fill();}}
    g.fillStyle=mech?'#79f7ff':giant?'#ff6a66':'#283f48';
    g.fillRect(-r*.35,headY-r*.35,r*.19,r*.2);
    g.fillRect(r*.15,headY-r*.35,r*.19,r*.2);
    if(e.hp<e.maxHp||giant||armored){
      const w=r*2.2,x=-w/2,y=headY-r*.99-8;
      g.fillStyle='#172a3d';g.fillRect(x-1,y-1,w+2,6);
      g.fillStyle=e.hp/e.maxHp>.45?'#95f1a0':'#ff9a7e';g.fillRect(x,y,w*Math.max(0,e.hp/e.maxHp),4);
    }
    g.restore();
  }
}

// Firebase Spark Auth + Cloudflare Workers Free / Durable Objects WebSockets.
// All game state mutations happen on the authenticated Cloudflare server.
class Online {
  constructor(){
    this.config=globalThis.__FIREBASE_CONFIG__||null;
    this.api=(globalThis.__CLOUDFLARE_API__||'').replace(/\/$/,'');
    this.enabled=!!(this.config?.apiKey&&this.config.projectId&&/^https:\/\//.test(this.api));
    this.user=null;this.room=null;this.socket=null;this.seq=0;this.pending=new Map();this.nextId=0;
    this.retries=0;this.closed=true;this.serial=0;
  }
  async init(onUser){
    if(!this.enabled)return;
    const [app,auth]=await Promise.all([
      import('https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js')
    ]);
    const a=app.initializeApp(this.config);this.auth=auth.getAuth(a);this.authSDK=auth;
    auth.onAuthStateChanged(this.auth,async user=>{
      if(this.user?.uid!==user?.uid)this.stop();
      this.user=user;try{await onUser(user);}catch(e){this.onError?.(e);}
    });
  }
  async signIn(email,password,signup){if(!this.auth)throw Error('온라인 서버 설정이 필요합니다. DEPLOY.md를 확인하세요.');return signup?this.authSDK.createUserWithEmailAndPassword(this.auth,email,password):this.authSDK.signInWithEmailAndPassword(this.auth,email,password);}
  async signOut(){this.stop();if(this.auth)await this.authSDK.signOut(this.auth);}
  async apiCall(action,payload={}){
    if(!this.user)throw Error('먼저 계정에 로그인하세요.');
    const token=await this.user.getIdToken();
    const res=await fetch(this.api+'/api',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({action,payload})});
    const r=await res.json();if(!r.ok)throw Error(r.error||'서버 통신 오류');return r.data;
  }
  async call(action,payload={}){
    if(['command','pulse'].includes(action)&&this.room===payload.code&&this.socket?.readyState===WebSocket.OPEN){
      if(action==='pulse'){this.socket.send(JSON.stringify({type:'pulse'}));return {updated:true};}
      const id=++this.nextId;
      return new Promise((resolve,reject)=>{
        const timer=setTimeout(()=>{this.pending.delete(id);reject(Error('명령 확인 시간 초과'));},6000);
        this.pending.set(id,{resolve,reject,timer});
        this.socket.send(JSON.stringify({type:'command',command:payload.command,id}));
      });
    }
    if(action==='pulse')return {updated:false}; // never poll GAS/HTTP on a broken socket
    return this.apiCall(action,payload);
  }
  async watch(code,callback,onError){
    this.stop();this.room=code;this.closed=false;this.cb=callback;this.err=onError;
    const serial=++this.serial;
    await this.connect(serial);
  }
  async connect(serial){
    if(this.closed||serial!==this.serial||!this.user)return;
    try{
      const {ticket,code}=await this.apiCall('ticket',{code:this.room});
      if(this.closed||serial!==this.serial)return;
      const address=this.api.replace(/^http/,'ws')+'/socket?code='+encodeURIComponent(code)+'&ticket='+encodeURIComponent(ticket);
      const sock=new WebSocket(address);this.socket=sock;
      sock.onopen=()=>{this.retries=0;};
      sock.onmessage=e=>{
        try{
          const msg=JSON.parse(e.data);
          if(msg.type==='room')this.cb(msg.room);
          else if(msg.type==='ack'){
            const p=this.pending.get(msg.id);if(!p)return;
            clearTimeout(p.timer);this.pending.delete(msg.id);
            msg.error?p.reject(Error(msg.error)):p.resolve(msg.data);
          }else if(msg.type==='error')this.err?.(Error(msg.message));
        }catch(err){this.err?.(err);}
      };
      sock.onclose=()=>{
        if(this.socket===sock)this.socket=null;
        for(const p of this.pending.values()){clearTimeout(p.timer);p.reject(Error('WebSocket 연결이 끊겼습니다.'));}this.pending.clear();
        if(!this.closed&&serial===this.serial){
          const delay=Math.min(12000,800*2**Math.min(4,++this.retries));
          setTimeout(()=>this.connect(serial).catch(e=>this.err?.(e)),delay);
        }
      };
      sock.onerror=()=>this.err?.(Error('실시간 서버 연결을 확인하세요.'));
    }catch(e){
      this.err?.(e);
      if(!this.closed&&serial===this.serial){const delay=Math.min(12000,800*2**Math.min(4,++this.retries));setTimeout(()=>this.connect(serial).catch(err=>this.err?.(err)),delay);}
    }
  }
  stop(){
    this.closed=true;this.serial++;
    this.socket?.close(1000,'Leaving');this.socket=null;this.room=null;
    for(const p of this.pending.values()){clearTimeout(p.timer);p.reject(Error('방 연결 종료'));}this.pending.clear();
  }
}

  if(!r){toast('방이 종료되었습니다.');return;}room={...r,code};
  if(r.stateJson){playerId=online.user.uid;isOnlineMatch=true;lastSnapshot=performance.now();state=JSON.parse(r.stateJson);seenSnapshot=state.time;seq=Math.max(seq,state.players[playerId]?.seq||0);if(!$('#battlefield'))beginGame();else{updateHud();inspector();}}
  else {const names=Object.values(r.names||{});modal(`<span class="eyebrow">PRIVATE ROOM / ${r.config.type.toUpperCase()}</span><h2>친구 대기실</h2><p>참가 코드</p><div class="room-code">${esc(code)}</div><p>${names.map(esc).join(' · ')} (${names.length}/${r.config.type==='pvp'?2:4})</p><p>입장 코드를 친구에게 전달하세요. 시작 후에는 새 참가자가 들어올 수 없습니다.</p><button class="primary wide" data-action="startRoom" ${r.host===online.user.uid?'':'disabled'}>함께 시작</button><button class="wide secondary" data-action="leaveRoom">대기실 나가기</button>`);}
  },e=>toast('실시간 연결: '+e.message));}
async function pulse(now){if(!isOnlineMatch||!room||onlineBusy||now-lastPulse<2000||state?.status!=='playing')return;if(room.host!==playerId&&now-lastSnapshot<6500)return;lastPulse=now;onlineBusy=true;try{await online.call('pulse',{code:room.code});}catch(e){toast('동기화: '+e.message);}finally{onlineBusy=false;}}
const actions={
  noop(){},close(){if(!state)renderer=null;closeModal();},account,help,
  mapPreview(){modal('<h2>'+MAPS.find(m=>m.id===config.map).name+'</h2><canvas id="world" class="terrain-preview" aria-label="실제 전투 맵"></canvas><p>빛나는 분홍 입구에서 시작해 파란 출구로 향합니다.</p>');renderer=new Renderer($('#world'));},
  nav(id){page=id;config.type='solo';shell();},map(id){config.map=id;home();},difficulty(id){config.difficulty=id;home();},mode(id){config.modes=config.modes.includes(id)?config.modes.filter(x=>x!==id):[...config.modes,id];home();},
  inspect(id){selectedTower=id;page='towers';shell();},equip(id){mutate({kind:'equip',id});},shopTab(id){shopTab=id;shop();},buyTower(id){mutate({kind:'buyTower',id});},buyPack(id){mutate({kind:'buyPack',id});},pack(id){mutate({kind:'pack',id});},
  skin(id){modal(`<span class="eyebrow">TOWER COSMETICS</span><h2>${TOWERS[id].name} · 스킨</h2><div class="skin-options"><button data-action="setDefault" data-id="${id}">${portrait(id)}<b>기본 스킨</b></button><button data-action="setArctic" data-id="${id}">${portrait(id,'arctic')}<b>눈꽃 · ${profile.skins[id+':arctic']?'보유':'◈ 300'}</b></button></div><p>스킨은 외형만 바꾸며 능력치는 같습니다.</p>`);},
  setDefault(id){closeModal();mutate({kind:'skin',id,skin:'default'});},setArctic(id){closeModal();mutate({kind:'skin',id,skin:'arctic'});},
  pvp(){special('pvp');},coop(){special('coop');},events(){modal('<span class="eyebrow">PERMANENT CHALLENGE / 01</span><h2>음속을 넘어서</h2><div class="challenge-art">'+portrait('sonic')+'</div><p>익스트림 이상의 난이도에서 「슈퍼소닉」 모드를 적용해 클리어하세요.</p><p>보상: 신화 타워 <b>소닉</b> · 최초 클리어 시 영구 획득</p><button class="primary wide" data-action="challenge">도전 설정 적용</button>');},challenge(){config.difficulty='extreme';config.modes=['supersonic'];config.type='solo';closeModal();page='home';shell();},
  async start(){if(online.user){try{config.type='solo';const r=await online.call('createRoom',{config});await online.call('start',{code:r.code});await openRoom(r.code);}catch(e){toast(e.message);}}else startLocal();},trainingPvp(){startLocal('pvp');},
  selectPlace:selectPlacement,skip(){sendCommand({kind:'skip'});},send(id){sendCommand({kind:'send',type:id});},upgrade(){sendCommand({kind:'upgrade',id:renderer.selected});},sell(){sendCommand({kind:'sell',id:renderer.selected});},target(){const t=state.towers.find(t=>t.id===renderer.selected),targets=['first','strong','near'];if(t)sendCommand({kind:'target',id:t.id,target:targets[(targets.indexOf(t.target)+1)%3]});},battleMenu,leave,
  zoomIn(){renderer.camera.zoom=Math.min(3.3,renderer.camera.zoom*1.2);},zoomOut(){renderer.camera.zoom=Math.max(.55,renderer.camera.zoom/1.2);},zoomReset(){renderer.camera={x:900+state.players[playerId].field*2100,y:550,zoom:1.18};},field(){renderer.camera.x=renderer.camera.x<1800?3000:900;},
  async diagnostic(){try{const result=await online.call('diagnostic');modal(`<span class="eyebrow">ONLINE CHECK</span><h2>서버 연결 정상</h2><p>Firebase 인증 ✓ · Cloudflare Worker 통신 ✓ · D1 프로필 읽기 ✓</p><p>계정: ${esc(result.name)} · 서버 시간: ${esc(result.serverTime)}</p><p>실시간 대전 확인은 별도 계정 두 개로 방에 입장해 점검하세요.</p><button class="primary wide" data-action="close">확인</button>`);}catch(e){toast('연결 진단 실패: '+e.message);}},
  async logout(){await online.signOut();profile=localProfile;closeModal();shell();},
  async resumeRoom(){await openRoom(profile.activeRoom);},async abandonRoom(){try{await online.call('leave',{code:profile.activeRoom});profile=await online.call('profile');closeModal();shell();}catch(e){toast(e.message);}},
  async createRoom(){try{const r=await online.call('createRoom',{config});await openRoom(r.code);}catch(e){toast(e.message);}},joinPrompt(){modal('<h2>방 코드로 참가</h2><form id="join-form"><label>6자리 코드<input name="code" minlength="6" maxlength="6" pattern="[A-Za-z0-9]{6}" required autocomplete="off"></label><button class="primary wide">참가하기</button></form>');},async startRoom(){try{await online.call('start',{code:room.code});}catch(e){toast(e.message);}},async leaveRoom(){try{await online.call('leave',{code:room.code});online.stop();room=null;closeModal();profile=await online.call('profile');shell();}catch(e){toast(e.message);}}
};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;e.preventDefault();try{await actions[b.dataset.action]?.(b.dataset.id);}catch(err){toast(err.message);}});
document.addEventListener('input',e=>{if(e.target.id==='tower-search'){const pos=e.target.selectionStart;filter=e.target.value;collection();$('#tower-search').focus();$('#tower-search').setSelectionRange(pos,pos);}});
document.addEventListener('change',e=>{if(e.target.id==='rarity-filter'){rarityFilter=e.target.value;collection();}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);if(e.target.id==='auth-form'){const buttons=e.target.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);try{await online.signIn(f.get('email'),f.get('password'),e.submitter?.value==='signup');closeModal();}catch(err){$('#auth-error').textContent=err.message;}finally{buttons.forEach(b=>b.disabled=false);}}else if(e.target.id==='join-form'){try{const code=f.get('code').toUpperCase();await online.call('join',{code});await openRoom(code);}catch(err){toast(err.message);}}});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;const key=e.key.toLowerCase();if(state){if(e.code==='Space')e.preventDefault();if(renderer)renderer.keys.add(key);if(e.repeat)return;if(key==='escape'){if($('#modal-root').innerHTML)closeModal();else battleMenu();}else if(!$('#modal-root').innerHTML){if(key==='q')selectPlacement(null);if('12345'.includes(key)){const id=state.players[playerId].loadout[Number(key)-1];if(id)selectPlacement(id);}if(e.code==='Space')sendCommand({kind:'skip'});}}});
document.addEventListener('keyup',e=>renderer?.keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>renderer?.keys.clear());
function frame(now){const dt=Math.min(.1,(now-(lastTime||now))/1000);lastTime=now;
  if(state){if(!paused&&state.status==='playing'){accumulator+=dt;while(accumulator>=STEP){if(!isOnlineMatch){tick(state);bot();}accumulator-=STEP;}if(isOnlineMatch)pulse(now);}let visual=state;if(isOnlineMatch&&state.status==='playing'){const ahead=Math.min(2.2,Math.max(0,(now-lastSnapshot)/1000)),path=MAPS.find(m=>m.id===state.config.map).path;visual={...state,time:state.time+ahead,enemies:state.enemies.map(e=>({...e,...pointOnPath(path,e.progress+e.speed*ahead)}))};}renderer?.frame(visual,state.config.map,playerId,dt,now/1000);if(now-lastHud>150){updateHud();lastHud=now;}if(state.status!=='playing'&&!resultShown&&!onlineBusy)finish();}
  else if(renderer)renderer.frame(null,config.map,playerId,dt,now/1000,true);
  requestAnimationFrame(frame);
}
shell();requestAnimationFrame(frame);online.onError=e=>toast(e.message);
online.init(async user=>{if(user){profile=await online.call('profile');if(!state)shell();}else {profile=localProfile;if(!state)shell();}}).catch(e=>toast('계정 서비스: '+e.message));


})();</script></body></html>
